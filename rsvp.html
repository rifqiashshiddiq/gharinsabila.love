<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP — Gharin & Sabila</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="rsvp-page">

<div class="rsvp-card">
  <div class="eyebrow">Konfirmasi Kehadiran</div>
  <h1>RSVP</h1>
  <p class="subtitle">Mohon konfirmasi kehadiran Anda sebelum 1 September 2026</p>

  <form id="rsvpForm">
    <div class="rsvp-field">
      <label for="rsvpName">Nama Lengkap</label>
      <input type="text" id="rsvpName" placeholder="Nama Anda" required>
    </div>

    <div class="rsvp-field">
      <label for="rsvpStatus">Konfirmasi Kehadiran</label>
      <select id="rsvpStatus">
        <option value="Hadir">Hadir</option>
        <option value="Tidak Hadir">Tidak Hadir</option>
        <option value="Masih Ragu">Masih Ragu</option>
      </select>
    </div>

    <div class="rsvp-field">
      <label for="rsvpCount">Jumlah Tamu</label>
      <input type="number" id="rsvpCount" min="1" max="5" value="1">
    </div>

    <button type="submit" class="rsvp-submit">Kirim Konfirmasi</button>
  </form>

  <div class="rsvp-success" id="rsvpSuccess">
    Terima kasih! Konfirmasi Anda telah terkirim — mengarahkan kembali ke undangan…
  </div>

  <a href="index.html" class="rsvp-back">← Kembali ke Undangan</a>
</div>

<script>
  // Demo: form ini belum terhubung ke penyimpanan sungguhan.
  // Nanti di versi final, submit di sini akan mengirim data ke
  // Google Sheets lewat Google Apps Script (seperti dibahas sebelumnya).
  document.getElementById('rsvpForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const successMsg = document.getElementById('rsvpSuccess');
    successMsg.style.display = 'block';
    this.style.display = 'none';

    setTimeout(function () {
      window.location.href = 'index.html';
    }, 1600);
  });
</script>

</body>
</html>
